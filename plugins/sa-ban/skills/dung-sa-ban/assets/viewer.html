<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sa bàn dự án</title>
<style>
:root{--panel:#fff;--ink:#1f2a24;--muted:#6b756f;--line:#e2e5df;--accent:#2f5d46;--avail:#2e9e6b;--hold:#e0a030;--sold:#8d96a3}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#dfe8ec;overflow:hidden}
#stage{position:absolute;inset:0}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ctl{position:absolute;z-index:6}
select,input{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 8px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#tl{top:14px;left:14px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:5px 8px 5px 11px;box-shadow:0 2px 10px rgba(0,0,0,.12);flex-wrap:wrap;max-width:calc(100vw - 170px)}
#tl span{font-size:12px;color:var(--muted)}#tl select{border:0;font-weight:600;padding:5px 4px}
#tl b{font-size:13px;margin-right:6px}
#tr{top:14px;right:14px;display:flex;flex-direction:column;align-items:flex-end}
#fbtn i{font-style:normal;background:#fff;color:var(--accent);border-radius:9px;font-size:11px;padding:1px 7px;margin-left:6px;display:none}
#fp{display:none;margin-top:8px;width:min(320px,calc(100vw - 28px));max-height:calc(100vh - 90px);overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:14px 16px}
#fp.open{display:block}#fp label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 5px}
#fp .row{margin-bottom:12px}#fp select{width:100%}#fp .two{display:flex;gap:8px}#fp .two input{width:50%}
#fp .foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}#fp .foot b{flex:1;font-size:13px}
#bl{left:14px;bottom:12px;max-width:min(360px,calc(100vw - 28px))}
.legend{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px;display:inline-flex;gap:12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
#note{display:none;font-size:11px;background:#fff4dc;color:#8a5a00;border:1px solid #f0d9a5;border-radius:4px;padding:3px 7px}
#tip{position:absolute;pointer-events:none;background:rgba(31,42,36,.92);color:#fff;font-size:12px;padding:6px 8px;border-radius:5px;display:none;white-space:nowrap;z-index:5}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);text-align:center;padding:24px}
#um{position:absolute;inset:0;background:#15171a;z-index:20;display:none}#um.open{display:block}
#uv{position:absolute;inset:0}#uv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#uphoto{position:absolute;inset:0;background:#15171a center/contain no-repeat;display:none;z-index:1}
#utop{position:absolute;top:10px;right:12px;z-index:6;display:flex;gap:8px;align-items:center}
#utop .x{border:0;background:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
#ubar{position:absolute;left:0;right:0;bottom:10px;z-index:2;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 10px}
#uwalk{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;z-index:2;font-size:12px;color:#fff;background:rgba(20,24,28,.62);padding:5px 10px;border-radius:14px;display:none;white-space:nowrap}
#ubar .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#unote{position:absolute;left:12px;top:10px;z-index:2;font-size:11px;color:var(--muted);background:rgba(255,255,255,.9);padding:3px 8px;border-radius:4px;max-width:45%}
#uinfo{display:none;position:absolute;top:56px;right:12px;bottom:12px;width:min(340px,calc(100% - 24px));background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:5;overflow-y:auto;padding:20px 22px}
#uinfo.open{display:block}#uinfo .code{font-size:26px;font-weight:700;color:var(--accent)}#uinfo .sub{font-size:13px;color:var(--muted);margin:4px 0 10px}
#uinfo .price{font-size:22px;font-weight:700;margin:12px 0}#uinfo table{width:100%;border-collapse:collapse;font-size:13px}
#uinfo td{padding:7px 0;border-bottom:1px dashed var(--line)}#uinfo td:last-child{text-align:right;font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div class="ctl" id="tl"><b id="pname"></b><span>Kiểu hiển thị</span><select id="mode"><option value="status">Quỹ căn</option><option value="arch">Kiến trúc</option></select>
    <span>Ánh sáng</span><select id="time"><option value="day">Ban ngày</option><option value="night">Buổi tối</option></select></div>
  <div class="ctl" id="tr"><button class="btn pri" id="fbtn">Bộ lọc căn<i id="fcount"></i></button>
    <div id="fp">
      <div class="row"><label>Tòa</label><select id="fTower"></select></div>
      <div class="row"><label>Tầng</label><select id="fFloor"></select></div>
      <div class="row"><label>Trạng thái</label><select id="fStatus"><option value="">Tất cả trạng thái</option><option value="avail">Còn trống</option><option value="hold">Giữ chỗ</option><option value="sold">Đã bán</option></select></div>
      <div class="row"><label>Loại căn</label><select id="fType"></select></div>
      <div class="row"><label>Hướng ban công</label><select id="fDir"></select></div>
      <div class="row"><label>Khoảng giá (tỷ đồng)</label><div class="two"><input type="number" step="0.1" id="fP0" placeholder="từ"><input type="number" step="0.1" id="fP1" placeholder="đến"></div></div>
      <div class="row"><label>Diện tích (m²)</label><div class="two"><input type="number" id="fA0" placeholder="từ"><input type="number" id="fA1" placeholder="đến"></div></div>
      <div class="foot"><b id="count"></b><button class="btn" id="fClear">Xóa lọc</button><button class="btn" id="fClose">Đóng</button></div>
    </div></div>
  <div class="ctl" id="bl"><div class="legend"><span><i class="dot" style="background:var(--avail)"></i>Còn trống</span><span><i class="dot" style="background:var(--hold)"></i>Giữ chỗ</span><span><i class="dot" style="background:var(--sold)"></i>Đã bán</span></div><div id="note"></div></div>
  <div id="tip"></div><div id="msg">Đang tải sa bàn…</div>
  <div id="um"><div id="uv"></div><div id="uphoto"></div><div id="unote"></div><div id="ubar"></div><div id="uwalk">Kéo để nhìn quanh · bấm vào sàn để đi tới · W A S D / phím mũi tên để đi</div>
    <div id="utop"><button class="btn" id="uph" style="display:none">Ảnh phối cảnh</button><button class="btn pri" id="uib">Thông tin căn</button><button class="x" id="ux" aria-label="Đóng">×</button></div>
    <div id="uinfo"></div></div>
</div>

<script>

var MPc=SC.masterplan,mp=function(x,y){return [(x-(MPc?MPc.w/2:0))*(MPc?MPc.mPerPx:1),(y-(MPc?MPc.h/2:0))*(MPc?MPc.mPerPx:1)];};

var groundMat=null;

  groundMat=new THREE.MeshStandardMaterial({map:gt,color:0xb8b8b8,roughness:1,metalness:0,envMapIntensity:.3});
  groundMat.transparent=true;var gm=new THREE.Mesh(new THREE.PlaneGeometry(MPc.w*MPc.mPerPx,MPc.h*MPc.mPerPx),groundMat);gm.rotation.x=-Math.PI/2;gm.receiveShadow=true;gm.userData.ground=true;scene.add(gm);}

/* ---------- vật liệu mặt đứng ---------- */
var LK=CFG.look||{},LP=LK.podium||{};

  arch:pair(new THREE.Color(LK.roof||'#2a2f33').convertSRGBToLinear(),{color:0xffffff,map:TXd,roughness:LK.wall?.55:.25,metalness:LK.wall?.15:.6,envMapIntensity:LK.wall?.6:1.1}),
  podium:pair(new THREE.Color(LP.roof||LK.roof||'#2a2f33').convertSRGBToLinear(),{color:0xffffff,map:TXp,roughness:.45,metalness:.2,envMapIntensity:.8})};
var PODF=LP.floors!=null?LP.floors:(CFG.podiumFloors||0);function archOf(d){return d.floor<=PODF?MAT.podium:MAT.arch;}
['avail','hold','sold'].forEach(function(k){MAT[k].forEach(function(m){m.emissive.copy(m.color);m.emissiveIntensity=0;});});
var OM={};['avail','hold','sold'].forEach(function(k){OM[k]=new THREE.MeshBasicMaterial({color:MAT[k][0].color,transparent:true,opacity:.55,depthWrite:false});});
OM.dim=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55,depthWrite:false});OM.hover=new THREE.MeshBasicMaterial({color:0x1a73e8,transparent:true,opacity:.55,depthWrite:false});
var SLAB=new THREE.MeshStandardMaterial({color:0xf2f1ee,roughness:.95});
var LINE=new THREE.LineBasicMaterial({color:0x0b3d91});

/* ---------- dựng tòa ---------- */
function shapeOf(poly,k){var s=new THREE.Shape();poly.forEach(function(q,i){i?s.lineTo(q[0]*k,-q[1]*k):s.moveTo(q[0]*k,-q[1]*k);});return s;}

var rowKey=function(tw,f,c){return norm(tw)+'|'+f+'|'+norm(c);},ROW={};
SC.units.forEach(function(u){ROW[rowKey(u.tower,u.floor,u.code)]=u;if(u.pos)ROW[rowKey(u.tower,u.floor,u.pos)]=u;ROW[rowKey('',u.floor,u.code)]=ROW[rowKey('',u.floor,u.code)]||u;});

if(!towers.length){$('#msg').textContent='Sa bàn chưa có tòa nào được duyệt ranh căn và đặt vị trí.';return;}
$('#msg').style.display='none';
var plan=new THREE.Group();plan.visible=false;var planMesh=null,overlays=[],hoverI=-1;

/* ---------- trạng thái và lọc ---------- */
var st={tower:0,floor:null,mode:'status',time:'day',f:{status:'sold',type:'',dir:'',p0:null,p1:null,a0:null,a1:null},sel:null};
function passes(m){var r=m.userData.row,f=st.f;if(!r)return false;var pr=priceTy(r.price);
  return (!f.status||r.status===f.status)&&(!f.type||r.type===f.type)&&(!f.dir||r.dir===f.dir)&&(f.p0==null||(pr!=null&&pr>=f.p0))&&(f.p1==null||(pr!=null&&pr<=f.p1))&&(f.a0==null||(r.area!=null&&r.area>=f.a0))&&(f.a1==null||(r.area!=null&&r.area<=f.a1));}
var fcount=function(){var f=st.f;return (f.status?1:0)+(f.type?1:0)+(f.dir?1:0)+(f.p0!=null||f.p1!=null?1:0)+(f.a0!=null||f.a1!=null?1:0);};

function buildPlan(){
  var T=towers[st.tower],ft=T.byFloor[st.floor];while(plan.children.length)plan.remove(plan.children[0]);overlays=[];hoverI=-1;if(!ft)return;
  T.G.add(plan);plan.position.y=(st.floor-1)*FH;
  if(ft.img){var W=ft.w*ft.mPerPx,H=ft.h*ft.mPerPx,t=new THREE.TextureLoader().load(ft.img,function(){need=true;});t.encoding=THREE.sRGBEncoding;t.anisotropy=4;

    '<div class="price">'+fmtTy(r.price)+'</div><table>'+[['Loại căn',r.type],['Diện tích tim tường',r.area?r.area.toFixed(1)+' m²':''],['Diện tích thông thủy',r.netArea?r.netArea.toFixed(1)+' m²':''],['Đơn giá',pr&&r.netArea?(pr*1000/r.netArea).toFixed(1).replace('.',',')+' triệu/m²':''],['Hướng ban công',r.dir],['Layout',ut?ut.name:'']].filter(function(x){return x[1];}).map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>';}).join('')+'</table>'+
    (st.floor===r.floor?'':'<p><button class="btn pri" id="ugo" style="width:100%">Xem mặt bằng tầng '+r.floor+'</button></p>');
  var UV=m.userData.ft&&m.userData.ft.units[m.userData.idx];UV=UV&&UV.vec?UV:null;
  $('#um').classList.add('open');$('#uinfo').classList.toggle('open',!(UV||(ut&&ut.spec)));$('#uphoto').style.display='none';
  var bar=$('#ubar');bar.innerHTML='';aptOn=false;$('#uv').style.display='none';
  var ph=(ut&&ut.photos)||[],pi=-1;$('#uph').style.display=ph.length?'inline-block':'none';$('#uph').textContent='Ảnh phối cảnh';
  $('#uph').onclick=function(){pi++;if(pi>=ph.length){pi=-1;$('#uphoto').style.display='none';this.textContent='Ảnh phối cảnh';return;}$('#uphoto').style.backgroundImage='url('+ph[pi]+')';$('#uphoto').style.display='block';this.textContent='Ảnh '+(pi+1)+'/'+ph.length+' · bấm để xem tiếp';};
  if(UV||(ut&&ut.spec)){if(!APT)initApt();$('#uv').style.display='block';aptOn=true;aptSize();var views=UV?buildVecApt(UV,m.userData.ft):buildApt(ut.spec);if(UV)aptContext(m);else if(APT.ctx){APT.sc.remove(APT.ctx);APT.ctx=null;}
    views.splice(1,0,{n:'Đi bộ',fp:1,walk:1,p:(views[1]||views[0]).p,l:(views[1]||views[0]).l});
    views.forEach(function(v){var b=document.createElement('button');b.className='btn';b.textContent=v.n;b.onclick=function(){aptGo(v);};bar.appendChild(b);});aptGo(views[0],true);
    $('#unote').textContent=UV?'Mô hình dựng từ bản vẽ CAD của tầng · nội thất theo nét bản vẽ, dạng khối':'Mô hình dựng tự động từ layout "'+ut.name+'" · nội thất dạng khối minh họa';
  }else $('#unote').textContent='Loại căn này chưa có layout 3D.';
  var g=$('#ugo');if(g)g.onclick=function(){closeUnit();var i=towers.indexOf(m.userData.T);if(i!==st.tower){st.tower=i;$('#fTower').value=String(i);fillFloors();}setFloor(r.floor);};
}
function closeUnit(){$('#um').classList.remove('open');aptOn=false;walkSet(false);}
$('#ux').onclick=closeUnit;$('#uib').onclick=function(){$('#uinfo').classList.toggle('open');};window.addEventListener('keydown',function(e){if(e.key==='Escape')closeUnit();});

/* ---------- vòng lặp ---------- */
function resize(){need=true;renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();refresh();
window.saBan={getState:function(){return {tower:towers[st.tower].tw.name,floor:st.floor,mode:st.mode,time:st.time,filter:st.f,units:units.length};},goFloor:function(n){setFloor(n);return true;},setTime:setTime,
  showUnit:function(fl,code){var T=towers[st.tower];for(var k=0;k<units.length;k++){var d=units[k].userData;if(d.T===T&&d.floor===+fl&&(norm(d.code)===norm(code)||(d.row&&norm(d.row.code)===norm(code)))){openUnit(units[k]);return true;}}return false;},closeUnit:closeUnit};
window.addEventListener('message',function(e){var d=e.data;if(!d||typeof d.saBan!=='string'||typeof window.saBan[d.saBan]!=='function')return;var r=window.saBan[d.saBan].apply(null,d.args||[]);if(e.source)e.source.postMessage({saBanResult:d.saBan,id:d.id,result:r},'*');});
(function loop(){requestAnimationFrame(loop);
  if(anim){var k=Math.min(1,(performance.now()-anim.s)/1100),e=k*k*(3-2*k);camera.position.lerpVectors(anim.p0,anim.p1,e);controls.target.lerpVectors(anim.t0,anim.t1,e);if(k>=1){anim=null;NAV.p.copy(controls.target);}need=true;}
  controls.update();if(!need)return;need=false;renderer.render(scene,camera);})();
})();
</script>
