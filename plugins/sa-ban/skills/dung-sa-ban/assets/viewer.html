<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sa bàn dự án</title>
<style>
:root{--panel:#fff;--ink:#1f2a24;--muted:#6b756f;--line:#e2e5df;--accent:#2f5d46;--avail:#2e9e6b;--hold:#e0a030;--sold:#8d96a3}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#dfe8ec;overflow:hidden}
#stage{position:absolute;inset:0}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ctl{position:absolute;z-index:6}
select,input{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 8px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#tl{top:14px;left:14px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:5px 8px 5px 11px;box-shadow:0 2px 10px rgba(0,0,0,.12);flex-wrap:wrap;max-width:calc(100vw - 170px)}
#tl span{font-size:12px;color:var(--muted)}#tl select{border:0;font-weight:600;padding:5px 4px}
#tl b{font-size:13px;margin-right:6px}
#tr{top:14px;right:14px;display:flex;flex-direction:column;align-items:flex-end}
#fbtn i{font-style:normal;background:#fff;color:var(--accent);border-radius:9px;font-size:11px;padding:1px 7px;margin-left:6px;display:none}
#fp{display:none;margin-top:8px;width:min(320px,calc(100vw - 28px));max-height:calc(100vh - 90px);overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:14px 16px}
#fp.open{display:block}#fp label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 5px}
#fp .row{margin-bottom:12px}#fp select{width:100%}#fp .two{display:flex;gap:8px}#fp .two input{width:50%}
#fp .foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}#fp .foot b{flex:1;font-size:13px}
#bl{left:14px;bottom:12px;max-width:min(360px,calc(100vw - 28px))}
.legend{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px;display:inline-flex;gap:12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
#note{display:none;font-size:11px;background:#fff4dc;color:#8a5a00;border:1px solid #f0d9a5;border-radius:4px;padding:3px 7px}
#tip{position:absolute;pointer-events:none;background:rgba(31,42,36,.92);color:#fff;font-size:12px;padding:6px 8px;border-radius:5px;display:none;white-space:nowrap;z-index:5}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);text-align:center;padding:24px}
#um{position:absolute;inset:0;background:#15171a;z-index:20;display:none}#um.open{display:block}
#uv{position:absolute;inset:0}#uv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#uphoto{position:absolute;inset:0;background:#15171a center/contain no-repeat;display:none;z-index:1}
#utop{position:absolute;top:10px;right:12px;z-index:6;display:flex;gap:8px;align-items:center}
#utop .x{border:0;background:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
#ubar{position:absolute;left:0;right:0;bottom:10px;z-index:2;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 10px}
#ubar .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#unote{position:absolute;left:12px;top:10px;z-index:2;font-size:11px;color:var(--muted);background:rgba(255,255,255,.9);padding:3px 8px;border-radius:4px;max-width:45%}
#uinfo{display:none;position:absolute;top:56px;right:12px;bottom:12px;width:min(340px,calc(100% - 24px));background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:5;overflow-y:auto;padding:20px 22px}
#uinfo.open{display:block}#uinfo .code{font-size:26px;font-weight:700;color:var(--accent)}#uinfo .sub{font-size:13px;color:var(--muted);margin:4px 0 10px}
#uinfo .price{font-size:22px;font-weight:700;margin:12px 0}#uinfo table{width:100%;border-collapse:collapse;font-size:13px}
#uinfo td{padding:7px 0;border-bottom:1px dashed var(--line)}#uinfo td:last-child{text-align:right;font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div class="ctl" id="tl"><b id="pname"></b><span>Kiểu hiển thị</span><select id="mode"><option value="status">Quỹ căn</option><option value="arch">Kiến trúc</option></select>
    <span>Ánh sáng</span><select id="time"><option value="day">Ban ngày</option><option value="night">Buổi tối</option></select></div>
  <div class="ctl" id="tr"><button class="btn pri" id="fbtn">Bộ lọc căn<i id="fcount"></i></button>
    <div id="fp">
      <div class="row"><label>Tòa</label><select id="fTower"></select></div>
      <div class="row"><label>Tầng</label><select id="fFloor"></select></div>
      <div class="row"><label>Trạng thái</label><select id="fStatus"><option value="">Tất cả trạng thái</option><option value="avail">Còn trống</option><option value="hold">Giữ chỗ</option><option value="sold">Đã bán</option></select></div>
      <div class="row"><label>Loại căn</label><select id="fType"></select></div>
      <div class="row"><label>Hướng ban công</label><select id="fDir"></select></div>
      <div class="row"><label>Khoảng giá (tỷ đồng)</label><div class="two"><input type="number" step="0.1" id="fP0" placeholder="từ"><input type="number" step="0.1" id="fP1" placeholder="đến"></div></div>
      <div class="row"><label>Diện tích (m²)</label><div class="two"><input type="number" id="fA0" placeholder="từ"><input type="number" id="fA1" placeholder="đến"></div></div>
      <div class="foot"><b id="count"></b><button class="btn" id="fClear">Xóa lọc</button><button class="btn" id="fClose">Đóng</button></div>
    </div></div>
  <div class="ctl" id="bl"><div class="legend"><span><i class="dot" style="background:var(--avail)"></i>Còn trống</span><span><i class="dot" style="background:var(--hold)"></i>Giữ chỗ</span><span><i class="dot" style="background:var(--sold)"></i>Đã bán</span></div><div id="note"></div></div>
  <div id="tip"></div><div id="msg">Đang tải sa bàn…</div>
  <div id="um"><div id="uv"></div><div id="uphoto"></div><div id="unote"></div><div id="ubar"></div>
    <div id="utop"><button class="btn" id="uph" style="display:none">Ảnh phối cảnh</button><button class="btn pri" id="uib">Thông tin căn</button><button class="x" id="ux" aria-label="Đóng">×</button></div>
    <div id="uinfo"></div></div>
</div>
<!--SABAN_LIBS-->
<script>
(async function(){
var $=function(q){return document.querySelector(q);};
var SC=window.SCENE;
if(!SC){try{var r=await fetch('scene.json');if(!r.ok)throw 0;SC=await r.json();}catch(e){$('#msg').textContent='Không đọc được scene.json.';return;}}
if(!window.THREE){$('#msg').textContent='Không tải được thư viện 3D.';return;}
document.title='Sa bàn · '+SC.name;$('#pname').textContent=SC.name;
if(SC.dataNote){$('#note').style.display='inline-block';$('#note').textContent=SC.dataNote;}
var norm=function(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]/g,'');};
var CFG=SC.config||{},FH=+CFG.floorHeight||3.3,STATUS={avail:'Còn trống',hold:'Giữ chỗ',sold:'Đã bán'};
var fmtTy=function(v){return v==null?'–':(v>=1e6?v/1e9:v).toFixed(2).replace('.',',')+' tỷ';},priceTy=function(v){return v==null?null:(v>=1e6?v/1e9:v);};

/* ---------- cảnh ---------- */
var stage=$('#stage'),renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;
stage.insertBefore(renderer.domElement,stage.firstChild);
var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,2,5000),controls=new THREE.OrbitControls(camera,renderer.domElement),need=true;
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI*.45;controls.minPolarAngle=Math.PI*.06;controls.minDistance=40;controls.maxDistance=700;
controls.addEventListener('change',function(){need=true;});
var hemi=new THREE.HemisphereLight(0xffffff,0x7c837d,.2);scene.add(hemi);
var sun=new THREE.DirectionalLight(0xfff1dc,1.5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
(function(c){c.left=-380;c.right=380;c.top=380;c.bottom=-380;c.near=10;c.far=1200;c.updateProjectionMatrix();})(sun.shadow.camera);sun.shadow.bias=-.0006;sun.shadow.normalBias=.6;
sun.position.set(-170,260,90);scene.add(sun);scene.add(sun.target);
function cv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
var SKY={};(function(){
  var s=7;function rnd(){s=(s*16807)%2147483647;return s/2147483647;}
  function pano(top,mid,hor,stars){var c=cv(1024,512),g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,top);gr.addColorStop(.55,mid);gr.addColorStop(1,hor);g.fillStyle=gr;g.fillRect(0,0,1024,256);g.fillStyle=hor;g.fillRect(0,256,1024,256);
    for(var k=0;k<(stars?380:40);k++){if(stars){g.fillStyle='rgba(255,255,255,'+(.2+rnd()*.7)+')';g.fillRect(rnd()*1024,rnd()*210,1,1);}else{var x=rnd()*1024,y=40+rnd()*170,w=50+rnd()*120,h=8+rnd()*16,rg=g.createRadialGradient(x,y,0,x,y,w);rg.addColorStop(0,'rgba(255,255,255,.55)');rg.addColorStop(1,'rgba(255,255,255,0)');g.save();g.translate(x,y);g.scale(1,h/w);g.translate(-x,-y);g.fillStyle=rg;g.fillRect(x-w,y-w,2*w,2*w);g.restore();}}
    var t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;return t;}
  SKY.day=pano('#4f88c6','#9cc3e4','#dfe8ec');SKY.night=pano('#02050d','#0b1530','#1b1f30',true);
  var pm=new THREE.PMREMGenerator(renderer);SKY.dayEnv=pm.fromEquirectangular(SKY.day).texture;SKY.nightEnv=pm.fromEquirectangular(SKY.night).texture;pm.dispose();
  scene.background=SKY.day;scene.environment=SKY.dayEnv;scene.fog=new THREE.Fog(0xdfe8ec,700,3200);
})();
var MPc=SC.masterplan,mp=function(x,y){return [(x-(MPc?MPc.w/2:0))*(MPc?MPc.mPerPx:1),(y-(MPc?MPc.h/2:0))*(MPc?MPc.mPerPx:1)];};
var farMat=new THREE.MeshStandardMaterial({color:0x7f8672,roughness:1,metalness:0,envMapIntensity:.3}),far=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000),farMat);
far.rotation.x=-Math.PI/2;far.position.y=-.15;far.receiveShadow=true;scene.add(far);
var groundMat=null;
if(MPc&&MPc.img){var gt=new THREE.TextureLoader().load(MPc.img,function(){need=true;});gt.encoding=THREE.sRGBEncoding;gt.anisotropy=4;
  groundMat=new THREE.MeshStandardMaterial({map:gt,color:0xb8b8b8,roughness:1,metalness:0,envMapIntensity:.3});
  var gm=new THREE.Mesh(new THREE.PlaneGeometry(MPc.w*MPc.mPerPx,MPc.h*MPc.mPerPx),groundMat);gm.rotation.x=-Math.PI/2;gm.receiveShadow=true;scene.add(gm);}

/* ---------- vật liệu mặt đứng ---------- */
function facade(kind){
  var W=512,H=128,c=cv(W,H),g=c.getContext('2d'),P=kind==='dark'?{bg:CFG.glassColor||'#15191c',g1:'#3a4f5c',g2:'#1c272e',slab:'#8b9194',mul:'#0c0f11'}:{bg:'#d9dedb',g1:'#ffffff',g2:'#d3dada',slab:'#ffffff',mul:'#a7b0ad'};
  g.fillStyle=P.bg;g.fillRect(0,0,W,H);var bw=W/4,tone=[1,.86,.95,.8];
  for(var b=0;b<4;b++){var x=b*bw,gr=g.createLinearGradient(0,8,0,H-14);gr.addColorStop(0,P.g1);gr.addColorStop(1,P.g2);g.globalAlpha=kind==='dark'?tone[b]:1;g.fillStyle=gr;g.fillRect(x+5,8,bw-10,H-22);g.globalAlpha=1;g.fillStyle=P.mul;g.fillRect(x+bw/2-1.5,8,3,H-22);}
  g.fillStyle=P.slab;g.fillRect(0,H-14,W,14);
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/13.2,-1/FH);t.offset.set(0,1/FH);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
var TXd=facade('dark'),TXl=facade('light'),std=function(o){return new THREE.MeshStandardMaterial(o);};
function pair(cap,side){return [std({color:cap,roughness:.9}),std(side)];}
var MAT={avail:pair(0x2e9e6b,{color:0x22a866,map:TXl,roughness:.6,envMapIntensity:.4}),hold:pair(0xe0a030,{color:0xe79a12,map:TXl,roughness:.6,envMapIntensity:.4}),sold:pair(0x8d96a3,{color:0x808a98,map:TXl,roughness:.6,envMapIntensity:.4}),
  arch:pair(0x2a2f33,{color:0xffffff,map:TXd,roughness:.25,metalness:.6,envMapIntensity:1.1})};
['avail','hold','sold'].forEach(function(k){MAT[k].forEach(function(m){m.emissive.copy(m.color);m.emissiveIntensity=0;});});
var OM={};['avail','hold','sold'].forEach(function(k){OM[k]=new THREE.MeshBasicMaterial({color:MAT[k][0].color,transparent:true,opacity:.55,depthWrite:false});});
OM.dim=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55,depthWrite:false});OM.hover=new THREE.MeshBasicMaterial({color:0x1a73e8,transparent:true,opacity:.55,depthWrite:false});
var LINE=new THREE.LineBasicMaterial({color:0x0b3d91});

/* ---------- dựng tòa ---------- */
function shapeOf(poly,k){var s=new THREE.Shape();poly.forEach(function(q,i){i?s.lineTo(q[0]*k,-q[1]*k):s.moveTo(q[0]*k,-q[1]*k);});return s;}
function extr(s,h){var g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false});g.rotateX(-Math.PI/2);return g;}
var rowKey=function(tw,f,c){return norm(tw)+'|'+f+'|'+norm(c);},ROW={};
SC.units.forEach(function(u){ROW[rowKey(u.tower,u.floor,u.code)]=u;ROW[rowKey('',u.floor,u.code)]=ROW[rowKey('',u.floor,u.code)]||u;});
var units=[],towers=[],bbox=new THREE.Box3();
SC.towers.forEach(function(tw){
  if(tw.x==null||!tw.floorTypes.length)return;
  var G=new THREE.Group(),a=mp(tw.x,tw.y);G.position.set(a[0],0,a[1]);G.rotation.y=-(tw.rot||0)*Math.PI/180;scene.add(G);
  var T={tw:tw,G:G,byFloor:{},plans:{},floors:[]};towers.push(T);
  tw.floorTypes.forEach(function(ft){ft.geos=ft.units.map(function(u){return extr(shapeOf(u.poly,ft.mPerPx),FH-.3);});ft.flats=ft.units.map(function(u){var g=new THREE.ShapeGeometry(shapeOf(u.poly,ft.mPerPx));g.rotateX(-Math.PI/2);return g;});
    ft.floors.forEach(function(f){T.byFloor[f]=ft;});});
  var has=Object.keys(T.byFloor).map(Number).sort(function(x,y){return x-y;});
  for(var f=1;f<=tw.total;f++){
    var ft=T.byFloor[f],data=!!ft;if(!ft){var near=has.reduce(function(b,x){return Math.abs(x-f)<Math.abs(b-f)?x:b;},has[0]);ft=T.byFloor[near];}
    ft.units.forEach(function(u,i){var row=data?(ROW[rowKey(tw.name,f,u.code)]||ROW[rowKey('',f,u.code)]):null,m=new THREE.Mesh(ft.geos[i],MAT.arch);
      m.position.y=(f-1)*FH;m.castShadow=true;m.receiveShadow=true;m.userData={T:T,ft:ft,idx:i,floor:f,code:u.code,row:row};G.add(m);if(row)units.push(m);else m.userData.shell=true;T.floors.push(m);});
  }
  T.dataFloors=has;G.updateMatrixWorld(true);bbox.expandByObject(G);
});
if(!towers.length){$('#msg').textContent='Sa bàn chưa có tòa nào được duyệt ranh căn và đặt vị trí.';return;}
$('#msg').style.display='none';
var plan=new THREE.Group();plan.visible=false;var planMesh=null,overlays=[],hoverI=-1;

/* ---------- trạng thái và lọc ---------- */
var st={tower:0,floor:null,mode:'status',time:'day',f:{status:'sold',type:'',dir:'',p0:null,p1:null,a0:null,a1:null},sel:null};
function passes(m){var r=m.userData.row,f=st.f;if(!r)return false;var pr=priceTy(r.price);
  return (!f.status||r.status===f.status)&&(!f.type||r.type===f.type)&&(!f.dir||r.dir===f.dir)&&(f.p0==null||(pr!=null&&pr>=f.p0))&&(f.p1==null||(pr!=null&&pr<=f.p1))&&(f.a0==null||(r.area!=null&&r.area>=f.a0))&&(f.a1==null||(r.area!=null&&r.area<=f.a1));}
var fcount=function(){var f=st.f;return (f.status?1:0)+(f.type?1:0)+(f.dir?1:0)+(f.p0!=null||f.p1!=null?1:0)+(f.a0!=null||f.a1!=null?1:0);};
function unitAt(T,fl,i){for(var k=0;k<units.length;k++){var d=units[k].userData;if(d.T===T&&d.floor===fl&&d.idx===i)return units[k];}return null;}
function ovMat(i){var m=unitAt(towers[st.tower],st.floor,i);return m?(passes(m)?OM[m.userData.row.status]:OM.dim):OM.dim;}
function buildPlan(){
  var T=towers[st.tower],ft=T.byFloor[st.floor];while(plan.children.length)plan.remove(plan.children[0]);overlays=[];hoverI=-1;if(!ft)return;
  T.G.add(plan);plan.position.y=(st.floor-1)*FH;
  if(ft.img){var W=ft.w*ft.mPerPx,H=ft.h*ft.mPerPx,t=new THREE.TextureLoader().load(ft.img,function(){need=true;});t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
    var pm=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshBasicMaterial({map:t}));pm.rotation.x=-Math.PI/2;pm.position.set(W/2,.02,H/2);plan.add(pm);}
  ft.units.forEach(function(u,i){var m=new THREE.Mesh(ft.flats[i],ovMat(i));m.position.y=.1;m.userData={idx:i};plan.add(m);var l=new THREE.LineSegments(new THREE.EdgesGeometry(ft.flats[i]),LINE);l.position.y=.16;l.visible=false;plan.add(l);m.userData.line=l;overlays.push(m);});
}
function refresh(){
  var fl=st.floor,T=towers[st.tower],n=0,filt=fcount()>0,night=st.time==='night';
  towers.forEach(function(X){X.floors.forEach(function(m){var d=m.userData,cut=fl!==null&&X===T;
    if(cut&&d.floor>=fl){m.visible=false;return;}m.visible=true;
    if(d.shell||cut){m.material=MAT.arch;return;}
    var ok=passes(m);if(ok)n++;m.material=st.mode==='arch'?((filt&&ok)?MAT[d.row.status]:MAT.arch):(ok?MAT[d.row.status]:MAT.arch);});});
  plan.visible=fl!==null;if(fl!==null){buildPlan();n=0;T.byFloor[fl].units.forEach(function(u,i){var m=unitAt(T,fl,i);if(m&&passes(m))n++;});}
  $('#count').textContent=n+' căn khớp bộ lọc'+(fl===null?'':' ở tầng '+fl);
  var fc=fcount(),fe=$('#fcount');fe.textContent=fc;fe.style.display=fc?'inline':'none';
  renderer.shadowMap.needsUpdate=true;need=true;
}
function setTime(t){st.time=t;var n=t==='night';scene.background=n?SKY.night:SKY.day;scene.environment=n?SKY.nightEnv:SKY.dayEnv;scene.fog.color.set(n?0x1b1f30:0xdfe8ec);
  hemi.color.set(n?0x5d6c96:0xffffff);hemi.intensity=n?.24:.2;sun.color.set(n?0x9fb6ff:0xfff1dc);sun.intensity=n?.26:1.5;farMat.color.set(n?0x4a5060:0x7f8672);if(groundMat)groundMat.color.set(n?0x6c7282:0xb8b8b8);
  ['avail','hold','sold'].forEach(function(k){MAT[k].forEach(function(m){m.emissiveIntensity=n?(k==='sold'?.12:.5):0;});});refresh();}

/* ---------- camera ---------- */
var ctr=new THREE.Vector3(),size=new THREE.Vector3();bbox.getCenter(ctr);bbox.getSize(size);var R=Math.max(size.x,size.z,size.y)*1.15+60;
controls.maxDistance=Math.max(700,R*2.2);sun.target.position.set(ctr.x,0,ctr.z);sun.position.add(new THREE.Vector3(ctr.x,0,ctr.z));
camera.position.set(ctr.x-R*.75,size.y*.75+60,ctr.z-R*.7);controls.target.set(ctr.x,size.y*.45,ctr.z);
var anim=null;function fly(p,t){anim={p0:camera.position.clone(),t0:controls.target.clone(),p1:p,t1:t,s:performance.now()};}

function buildApt(spec){
